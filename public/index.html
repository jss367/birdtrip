<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birdtrip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ8HLK8MZKWrVZrZ4xLkQxEMfP0Z5tQ=" crossorigin="">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="binoculars"></i></div>
        <div>
          <h1>Birdtrip</h1>
          <p>Field stops for the road ahead.</p>
        </div>
      </header>

      <form id="searchForm" class="search-form">
        <section class="form-group">
          <div class="group-label">
            <i data-lucide="route"></i>
            <span>Route</span>
          </div>
          <label>
            <span>Origin</span>
            <input id="origin" name="origin" autocomplete="street-address" value="Yuma, AZ" required>
            <small class="field-error" id="originError" hidden></small>
          </label>
          <label>
            <span>Destination</span>
            <input id="destination" name="destination" autocomplete="street-address" value="Phoenix, AZ" required>
            <small class="field-error" id="destinationError" hidden></small>
          </label>
        </section>

        <section class="form-group">
          <div class="group-label">
            <i data-lucide="sliders-horizontal"></i>
            <span>Search Window</span>
          </div>
          <div class="control-grid">
            <label>
              <span>Max added</span>
              <div class="number-field">
                <input id="maxDetour" name="maxDetour" type="number" min="0" max="240" value="60">
                <small>min</small>
              </div>
            </label>
            <label>
              <span>Recent</span>
              <div class="number-field">
                <input id="recentDays" name="recentDays" type="number" min="1" max="30" value="14">
                <small>days</small>
              </div>
            </label>
            <label>
              <span>Radius</span>
              <div class="number-field">
                <input id="radiusKm" name="radiusKm" type="number" min="1" max="50" value="25">
                <small>km</small>
              </div>
            </label>
            <label>
              <span>Stops</span>
              <div class="number-field">
                <input id="maxStops" name="maxStops" type="number" min="3" max="20" value="10">
                <small>max</small>
              </div>
            </label>
          </div>
        </section>

        <section class="form-group">
          <div class="group-label">
            <i data-lucide="feather"></i>
            <span>Birding</span>
          </div>
          <label>
            <span>eBird API token</span>
            <input id="apiToken" name="apiToken" type="password" placeholder="Paste token or use EBIRD_API_KEY">
          </label>
          <label class="check-line">
            <input id="rememberToken" name="rememberToken" type="checkbox">
            <span>Remember token in this browser</span>
          </label>

          <label>
            <span>Target species</span>
            <textarea id="targets" name="targets" rows="4" placeholder="One common name per line"></textarea>
          </label>
        </section>

        <div class="actions">
          <button class="primary" type="submit">
            <i data-lucide="search"></i>
            Find Stops
          </button>
          <button type="button" id="sampleButton" title="Use sample route">
            <i data-lucide="map-pinned"></i>
          </button>
          <button type="button" id="clearButton" title="Clear results">
            <i data-lucide="x"></i>
          </button>
          <button type="button" id="printButton" title="Print report">
            <i data-lucide="printer"></i>
          </button>
        </div>
      </form>

      <section class="status-panel" aria-live="polite">
        <div class="status-heading">
          <i data-lucide="activity"></i>
          <div id="progressTitle">Ready</div>
        </div>
        <p id="progressMessage">Enter a route and run a search.</p>
      </section>

      <section class="warning" id="warningPanel" role="status" hidden>
        <div class="warning-heading">
          <i data-lucide="triangle-alert"></i>
          <span>Partial data</span>
        </div>
        <p id="warningMessage"></p>
      </section>

      <section class="summary-panel">
        <div>
          <span id="routeDistance">-</span>
          <small>route miles</small>
        </div>
        <div>
          <span id="routeDuration">-</span>
          <small>drive time</small>
        </div>
        <div>
          <span id="candidateCount">-</span>
          <small>ranked stops</small>
        </div>
      </section>
    </aside>

    <main class="workspace">
      <section class="map-region">
        <div id="map"></div>
        <div class="map-glass" aria-hidden="true">
          <span><i data-lucide="map"></i> Route Map</span>
          <span><i data-lucide="navigation"></i> Corridor Scan</span>
        </div>
      </section>

      <section class="results-region">
        <div class="results-header">
          <div>
            <h2>Ranked Stops</h2>
            <p id="resultContext">No route searched yet.</p>
          </div>
          <div class="legend">
            <span><b class="tier high"></b>High</span>
            <span><b class="tier mid"></b>Good</span>
            <span><b class="tier low"></b>Scout</span>
          </div>
        </div>
        <div id="resultsList" class="results-list empty">
          <div class="empty-state">
            <i data-lucide="binoculars"></i>
            <p>Results will appear here after the first search.</p>
          </div>
        </div>
      </section>

      <aside id="detailsPanel" class="details-panel" hidden>
        <button id="closeDetails" title="Close details"><i data-lucide="x"></i></button>
        <div id="detailsContent"></div>
      </aside>
    </main>
  </div>

  <section id="report" class="report" aria-hidden="true"></section>

  <template id="resultTemplate">
    <article class="stop-card">
      <button class="stop-main" type="button">
        <span class="rank"></span>
        <span class="stop-copy">
          <strong class="stop-name"></strong>
          <small class="stop-preview"></small>
        </span>
        <span class="score-pill"></span>
      </button>
      <div class="stop-metrics">
        <span title="Added drive time"><i data-lucide="clock-3"></i><b class="metric-detour"></b></span>
        <span title="Approx. distance off route"><i data-lucide="ruler"></i><b class="metric-offroute"></b></span>
        <span title="Recent species"><i data-lucide="feather"></i><b class="metric-species"></b></span>
        <span title="Notable species"><i data-lucide="sparkles"></i><b class="metric-notable"></b></span>
        <span title="Target matches"><i data-lucide="target"></i><b class="metric-targets"></b></span>
      </div>
      <div class="stop-links">
        <a class="stop-dir" target="_blank" rel="noreferrer"><i data-lucide="navigation"></i>Directions</a>
        <a class="stop-ebird" target="_blank" rel="noreferrer"><i data-lucide="external-link"></i>eBird</a>
      </div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
