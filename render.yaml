services:
  - type: web
    name: birdtrip
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    domains:
      - birdtrip.org
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: true
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: EBIRD_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
